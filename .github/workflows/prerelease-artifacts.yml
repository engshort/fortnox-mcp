name: Prerelease artifacts

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v0.*-*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-packet:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.19.0'
      - name: Install locked build dependencies
        run: npm install --global npm@11.9.0 --ignore-scripts --no-audit --no-fund && npm ci --ignore-scripts --no-audit --no-fund
      - name: Build matching source and dependency records
        run: npm run build
      - name: Prepare immutable source packet
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: |
          version=0.1.0-mvp.5.0
          if [ "$RELEASE_REF_TYPE" = tag ]; then
            version="${RELEASE_REF_NAME#v}"
          fi
          node scripts/prepare-release.mjs "$version" "$RUNNER_TEMP/fortnox-m5-source"
          cd "$RUNNER_TEMP/fortnox-m5-source"
          sha256sum -c SHA256SUMS
      - name: Retain candidate for authorized maintainer review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: m05-source-${{ github.sha }}
          path: ${{ runner.temp }}/fortnox-m5-source/
          if-no-files-found: error
          retention-days: 14
