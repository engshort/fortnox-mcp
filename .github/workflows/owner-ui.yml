name: Owner UI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  owner-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Install locked build dependencies
        run: npm install --global npm@11.9.0 --ignore-scripts --no-audit --no-fund && npm ci --ignore-scripts --no-audit --no-fund
      - name: Build the actual product UI
        run: npm run build
      - name: Install pinned owner UI test dependencies and browser
        working-directory: spikes/s00-oauth
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install --with-deps chromium
      - name: Test the built owner UI on desktop and mobile
        working-directory: spikes/s00-oauth
        run: npx --no-install playwright test --config playwright.owner.config.ts
