name: M05 Docker
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  docker-https:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.19.0'
      - name: Install pinned build dependencies for local candidate comparison
        run: npm install --global npm@11.9.0 --ignore-scripts --no-audit --no-fund && npm ci --ignore-scripts --no-audit --no-fund
      - name: Build matching local artifacts and dependency-input records
        run: npm run build
      - name: Test built non-root image through Nginx and HTTPS
        env:
          M05_RC_VERSION: 0.1.0-mvp.5.0
          M05_RC_OUTPUT: ${{ runner.temp }}/fortnox-m5-draft-candidate
        run: node scripts/docker-smoke.mjs
