# Include inside the existing Nginx http context. Replace domain/certificate paths.
# Do not add $request, $request_uri or query strings to application access logs.
server {
    listen 443 ssl;
    server_name fortnox.example.invalid;
    ssl_certificate /etc/letsencrypt/live/fortnox.example.invalid/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fortnox.example.invalid/privkey.pem;
    access_log off;
    error_log /dev/null;
    client_max_body_size 16k;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header Forwarded "";
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 75s;
        # Never resend an uncertain financial request to another upstream.
        proxy_next_upstream off;
    }
}
