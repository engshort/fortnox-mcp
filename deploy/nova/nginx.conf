# Private ingress from ISS/WireGuard only. TLS terminates at the public Nginx.
server {
    listen 8080;
    server_name fortnox.mcp.engshort.se;
    access_log off;
    error_log /dev/null;
    client_max_body_size 16k;
    allow 172.30.77.1;
    allow 172.30.77.10;
    allow 10.77.0.1;
    deny all;
    if ($http_host != "fortnox.mcp.engshort.se") { return 421; }
    if ($http_x_forwarded_proto != "https") { return 400; }
    include /etc/nginx/revision/revision.conf;
    location / {
        resolver 127.0.0.11 valid=5s;
        set $application fortnox-mcp;
        proxy_pass http://$application:3000;
        proxy_http_version 1.1;
        proxy_set_header Host fortnox.mcp.engshort.se;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header Forwarded "";
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 75s;
        proxy_next_upstream off;
    }
}
