name: fortnox-mcp-nova
services:
  fortnox-mcp:
    image: ${FORTNOX_MCP_IMAGE:?Select an immutable deployment image}
    env_file: .private/installation.env
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      DATA_DIR: /data
      NODE_PROXY_MODE: nginx
      AUTH_SECRET_FILE: /run/secrets/auth_secret
      CREDENTIAL_KEYS_FILE: /run/secrets/credential_keys
      BACKUP_KEY_FILE: /run/secrets/backup_key
    volumes: [fortnox-data:/data]
    secrets: [auth_secret, credential_keys, backup_key]
    restart: unless-stopped
    stop_grace_period: 35s
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1
    pids_limit: 128
    logging:
      driver: local
      options: {max-size: 5m, max-file: "3"}
  proxy:
    image: nginx:1.28-alpine
    ports: ["172.30.77.10:13001:8080"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.private/revision:/etc/nginx/revision:ro
    restart: unless-stopped
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    pids_limit: 64
    logging:
      driver: local
      options: {max-size: 1m, max-file: "2"}
volumes:
  fortnox-data:
    name: fortnox-mcp-nova-data
secrets:
  auth_secret:
    file: .private/auth-secret
  credential_keys:
    file: .private/credential-keys.json
  backup_key:
    file: .private/backup-key
