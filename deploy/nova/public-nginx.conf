# Apply on Nova through persistent ISPConfig settings, after provisioning TLS.
# ISS forwards public TCP 80/443 to Nova; no web server is required on ISS.
server {
    listen 80;
    server_name fortnox.mcp.engshort.se;
    access_log off;
    error_log /dev/null;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 308 https://fortnox.mcp.engshort.se$request_uri; }
}
server {
    listen 443 ssl;
    server_name fortnox.mcp.engshort.se;
    ssl_certificate /etc/letsencrypt/live/fortnox.mcp.engshort.se/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fortnox.mcp.engshort.se/privkey.pem;
    access_log off;
    error_log /dev/null;
    client_max_body_size 16k;
    location / {
        proxy_pass http://172.30.77.10:13001;
        proxy_http_version 1.1;
        proxy_set_header Host fortnox.mcp.engshort.se;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header Forwarded "";
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 75s;
        proxy_next_upstream off;
    }
}
